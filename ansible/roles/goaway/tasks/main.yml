---
- name: Ensure application directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0755'
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/config"
    - "{{ app_dir }}/data"

- name: Deploy docker-compose.yml from template
  template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    mode: '0644'

# Uncomment and set variables if using a private registry
# - name: Log into GHCR
#   docker_login:
#     registry_url: ghcr.io
#     username: "{{ github_username }}"
#     password: "{{ github_pat }}"

- name: Pull images
  command: docker compose pull
  args:
    chdir: "{{ app_dir }}"
  changed_when: true

- name: Ensure application is running
  command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ app_dir }}"
  changed_when: true
