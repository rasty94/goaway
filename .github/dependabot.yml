version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/terraform-provider-goaway"]
    schedule: { interval: weekly }
    groups:
      go-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule: { interval: weekly }
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
