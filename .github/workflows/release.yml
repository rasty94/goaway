name: Release

# Manual releases: update CHANGELOG.md and charts/goaway/Chart.yaml, commit
# "chore(release): prepare vX.Y.Z", then push the tag vX.Y.Z.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check chart version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          chart=$(awk '/^version:/{print $2}' charts/goaway/Chart.yaml)
          app=$(awk -F'"' '/^appVersion:/{print $2}' charts/goaway/Chart.yaml)
          if [ "$chart" != "$tag" ] || [ "$app" != "$tag" ]; then
            echo "::error::Chart.yaml version=$chart appVersion=$app, expected $tag"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 10.23.0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Build frontend
        run: make build

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: make publish
