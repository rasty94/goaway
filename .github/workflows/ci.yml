name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.23.0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm -C ./client install --frozen-lockfile

      - name: Commit lint
        if: github.event_name == 'pull_request'
        run: pnpm -C ./client exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: ESLint
        run: pnpm -C ./client exec eslint

      - name: Unit tests
        run: pnpm -C ./client test --coverage

      - name: Build
        run: pnpm -C ./client build

      - name: Dependency audit
        run: pnpm -C ./client audit --prod --audit-level high

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # main.go embeds client/dist; a placeholder is enough for lint/vet/vuln.
      - name: Placeholder frontend build
        run: mkdir -p client/dist && touch client/dist/.fake

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: ./backend/... ./cmd/...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Tests
        run: go test -count=1 -race ./backend/... ./test/...

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: E2E smoke tests
        run: make e2e

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.2

      - name: Lint
        run: helm lint charts/goaway

      - name: Template (default and stateless profiles)
        run: |
          helm template goaway charts/goaway >/dev/null
          helm template goaway charts/goaway -f charts/goaway/values-stateless.yaml >/dev/null

  terraform-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform-provider-goaway
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: terraform-provider-goaway/go.mod
          cache-dependency-path: terraform-provider-goaway/go.sum

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -count=1 ./...

      - name: Build
        run: go build ./...
